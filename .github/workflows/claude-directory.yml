name: Notify Claude Directory

on: push

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Send push event to Claude Directory
        env:
          WEBHOOK_URL: ${{ secrets.CLAUDE_DIRECTORY_WEBHOOK_URL }}
          WEBHOOK_SECRET: ${{ secrets.CLAUDE_DIRECTORY_WEBHOOK_APIKEY}}
        run: |
          # $GITHUB_EVENT_PATH holds the same push payload a GitHub webhook would deliver.
          sig=$(openssl dgst -sha256 -hmac "$WEBHOOK_SECRET" "$GITHUB_EVENT_PATH" | awk '{print $NF}')
          curl --fail-with-body -sS -X POST "$WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -H "X-GitHub-Event: push" \
            -H "X-GitHub-Delivery: $(uuidgen)" \
            -H "X-Hub-Signature-256: sha256=$sig" \
            --data-binary @"$GITHUB_EVENT_PATH"
